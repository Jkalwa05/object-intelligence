[project]
name = "object-intelligence"
version = "0.1.0"
description = "Hold any object up to the camera: live detection, tracking and honest identification."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "ultralytics",
    "torch",
    "numpy",
    "pydantic>=2",
    "anthropic",
    "python-dotenv",
    "lap>=0.5.12",
    "pyobjc-framework-vision>=12.2.2",
    "mlx-whisper>=0.4.3",
    "pypdfium2>=5.13.0",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "model: loads the YOLOE weights (slow, downloads them on first run)",
    "claude: makes a real Claude API call (costs about 2 cents)",
    "scad: runs the real OpenSCAD compiler (needs node and web/node_modules)",
]
addopts = "-m 'not model and not claude and not scad'"
